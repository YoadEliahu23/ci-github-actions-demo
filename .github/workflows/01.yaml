name: check-push

on:
  push:
    branches:
      - master
      - main
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: 3.9

      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip
          
      - name: Run tests
        run: |
           python -m unittest test_main.py
       
